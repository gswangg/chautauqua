name: CI

on:
  push:
  pull_request:

# One run per ref at a time. A push train (the swarm lands several commits a
# minute) otherwise starts a full 5-job fan-out per commit and the runs starve
# each other on the shared runner pool -- 16 concurrent runs on 2026-08-17
# pushed test-full's page-measure scan past its 5s testTimeout purely from CPU
# contention. Only the tip of a branch is interesting anyway, so supersede.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stage-1 scope only (DEC-034): typecheck + unit tests, plus a local perf
# smoke run against a 2k-row seeded event. Everything here runs against
# `wrangler dev`'s local Miniflare/D1 — no deploy, no secrets, no external
# accounts.

jobs:
  # Every push/PR gets fast build + fast (node-only, no jsdom/wrangler/
  # miniflare/playwright) test signal. test/test-tiers.test.ts (part of
  # this tier) enforces that the fast/full split stays accurate, so PRs
  # never need the slower full suite to get useful signal -- DEC-727.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run test:fast

  # The one full/locked suite run (mandate item 73: PRs stay on the fast
  # path above; this is the sole job that runs test:full).
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:full

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run perf:seed
      - run: npx tsx scripts/ensure-dev-vars.ts  # DEC-187
      - name: Start wrangler dev in background
        run: npx wrangler dev --port 8787 > wrangler-dev.log 2>&1 &
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/health > /dev/null; then
              echo "wrangler dev is up"
              exit 0
            fi
            sleep 1
          done
          echo "wrangler dev did not become healthy in time"
          cat wrangler-dev.log || true
          exit 1
      - run: npm run perf:smoke
      - name: Show wrangler dev log on failure
        if: failure()
        run: cat wrangler-dev.log || true

  walkthrough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run seed
      - run: npx tsx scripts/ensure-dev-vars.ts  # DEC-187
      - name: Start wrangler dev in background
        run: npx wrangler dev --port 8787 > wrangler-dev.log 2>&1 &
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/health > /dev/null; then
              echo "wrangler dev is up"
              exit 0
            fi
            sleep 1
          done
          echo "wrangler dev did not become healthy in time"
          cat wrangler-dev.log || true
          exit 1
      - run: npm run walkthrough
      - name: Show wrangler dev log on failure
        if: failure()
        run: cat wrangler-dev.log || true

  render-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:render-sweep
